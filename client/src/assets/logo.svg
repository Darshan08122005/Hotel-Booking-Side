<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <!-- Base Line -->
  <rect x="40" y="230" width="300" height="10" fill="#4a2511" rx="5"/>
  
  <!-- Building Left Wing -->
  <rect x="60" y="110" width="70" height="120" fill="#cc5833"/>
  <!-- Building Right Wing -->
  <rect x="250" y="110" width="70" height="120" fill="#cc5833"/>
  <!-- Building Center -->
  <rect x="130" y="80" width="120" height="150" fill="#cc5833"/>
  
  <!-- Roof Trim Accents -->
  <rect x="55" y="100" width="80" height="10" fill="#edb08c"/>
  <rect x="245" y="100" width="80" height="10" fill="#edb08c"/>
  <rect x="125" y="70" width="130" height="10" fill="#edb08c"/>
  
  <!-- Top Roof Sign -->
  <rect x="145" y="20" width="90" height="25" fill="#5c3016" rx="3"/>
  <text x="190" y="38" font-family="sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="2">HOTEL</text>
  <rect x="165" y="45" width="6" height="25" fill="#4a2511"/>
  <rect x="209" y="45" width="6" height="25" fill="#4a2511"/>

  <!-- Windows (Left Wing) -->
  <rect x="75" y="125" width="15" height="18" fill="#87ceeb"/>
  <rect x="100" y="125" width="15" height="18" fill="#87ceeb"/>
  <rect x="75" y="160" width="15" height="18" fill="#87ceeb"/>
  <rect x="100" y="160" width="15" height="18" fill="#87ceeb"/>

  <!-- Windows (Center) -->
  <rect x="145" y="95" width="15" height="18" fill="#87ceeb"/>
  <rect x="182" y="95" width="15" height="18" fill="#87ceeb"/>
  <rect x="220" y="95" width="15" height="18" fill="#87ceeb"/>
  <rect x="145" y="130" width="15" height="18" fill="#87ceeb"/>
  <rect x="182" y="130" width="15" height="18" fill="#87ceeb"/>
  <rect x="220" y="130" width="15" height="18" fill="#87ceeb"/>

  <!-- Windows (Right Wing) -->
  <rect x="265" y="125" width="15" height="18" fill="#87ceeb"/>
  <rect x="290" y="125" width="15" height="18" fill="#87ceeb"/>
  <rect x="265" y="160" width="15" height="18" fill="#87ceeb"/>
  <rect x="290" y="160" width="15" height="18" fill="#87ceeb"/>

  <!-- Center Door -->
  <rect x="165" y="170" width="50" height="60" fill="#4a2511"/>
  <rect x="167" y="172" width="22" height="58" fill="#5c3016"/>
  <rect x="191" y="172" width="22" height="58" fill="#5c3016"/>

  <!-- Simple Trees -->
  <ellipse cx="150" cy="190" rx="8" ry="18" fill="#9acd32"/>
  <rect x="149" y="200" width="2" height="30" fill="#4a2511"/>
  
  <ellipse cx="230" cy="190" rx="8" ry="18" fill="#9acd32"/>
  <rect x="229" y="200" width="2" height="30" fill="#4a2511"/>

  <!-- The Text "HOTELA" -->
  <text x="360" y="215" font-family="sans-serif" font-weight="bold" font-size="150" fill="#cc5833">HOTELA</text>
</svg>
